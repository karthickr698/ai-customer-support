[project]
name = "ai-customer-support-ai"
version = "0.0.1"
description = "Python AI service for the AI Customer Support platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "pypdf>=5.0.0,<6",
  "python-docx>=1.1.0,<2",
  "asyncpg>=0.30.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1",
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
]

[project.scripts]
ai-customer-support-ai = "app.main:run"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]
